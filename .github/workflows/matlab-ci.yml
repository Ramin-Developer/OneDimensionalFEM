name: MATLAB CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('finite-element-method/matlab-code'));
            addpath('tests');
            assert(exist('Main_Program','file') == 2, 'Main_Program.m not found');
            results = runtests('tests');
            assert(all([results.Passed]), 'One or more tests failed.');
            disp('MATLAB tests passed.');
