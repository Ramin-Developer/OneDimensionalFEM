name: MATLAB CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            run('tests/run_tests_with_coverage.m');
